<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>DF Resolve - Frontend</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
      crossorigin="anonymous"
    />

    <link rel="stylesheet" href="/static/css/style.css" />
  </head>
  <body class="container py-4">
    <h1>Cadastro</h1>
    <form id="form-register" class="mb-4">
      <input
        id="reg-username"
        type="text"
        placeholder="Usuário"
        required
        class="form-control mb-2"
      />
      <input
        id="reg-email"
        type="email"
        placeholder="Email"
        required
        class="form-control mb-2"
      />
      <input
        id="reg-password"
        type="password"
        placeholder="Senha"
        required
        class="form-control mb-2"
      />
      <button type="submit" class="btn btn-primary">Cadastrar</button>
    </form>

    <h1>Login</h1>
    <form id="form-login" class="mb-4">
      <input
        id="login-email"
        type="email"
        placeholder="Email"
        required
        class="form-control mb-2"
      />
      <input
        id="login-password"
        type="password"
        placeholder="Senha"
        required
        class="form-control mb-2"
      />
      <button type="submit" class="btn btn-success">Entrar</button>
    </form>

    <h1>Denúncias</h1>
    <button id="btn-listar" class="btn btn-info mb-3">Listar denúncias</button>
    <ul id="lista-denuncias" class="list-group mb-4"></ul>

    <h2>Criar Denúncia</h2>
    <form id="form-denuncia" class="mb-4">
      <input
        id="denuncia-titulo"
        type="text"
        placeholder="Título"
        required
        class="form-control mb-2"
      />
      <textarea
        id="denuncia-descricao"
        placeholder="Descrição"
        required
        class="form-control mb-2"
      ></textarea>
      <button type="submit" class="btn btn-warning">Criar</button>
    </form>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
      crossorigin="anonymous"
    ></script>

    <script src="/static/js/app.js"></script>
  </body>
</html>
