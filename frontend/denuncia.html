<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Denúncias</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="container">
    <h1>Minhas Denúncias</h1>

    <form id="denunciaForm" class="mb-4">
        <input type="text" id="titulo" placeholder="Título" required class="form-control mb-2">
        <input type="text" id="endereco" placeholder="Endereço" required class="form-control mb-2">
        <textarea id="descricao" placeholder="Descrição" required class="form-control mb-2"></textarea>
        <button type="submit" class="btn btn-primary">Criar Denúncia</button>
    </form>

    <ul id="listaDenuncias" class="list-group mb-3"></ul>

    <button id="logoutBtn" class="btn btn-danger">Sair</button>

    <script src="js/denuncia.js"></script>
</body>
</html>
